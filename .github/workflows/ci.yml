name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: letterpress/approaches/web-client-server/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: letterpress/approaches/web-client-server/backend/go.mod
          cache-dependency-path: letterpress/approaches/web-client-server/backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
      - run: git diff --exit-code -- internal/store/sqlite/db
      - run: ./internal/game/dictionary/generate.sh
      - run: git diff --exit-code -- internal/game/dictionary/words.txt internal/game/dictionary/LICENSE-ESDB.txt
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: letterpress/approaches/web-client-server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test -- --run
      - run: pnpm build

  end-to-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: letterpress/approaches/web-client-server/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: letterpress/approaches/web-client-server/backend/go.mod
          cache-dependency-path: letterpress/approaches/web-client-server/backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: letterpress/approaches/web-client-server/frontend/test-results
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f letterpress/approaches/web-client-server/Containerfile -t letterpress:ci letterpress/approaches/web-client-server
